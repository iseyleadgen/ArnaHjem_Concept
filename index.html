<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArnaHjem Renhold | Kundene på autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --char:#4A4852; --char-2:#3E3C45; --char-ink:#F3F3F1; --char-muted:#BDBBC6;
  --lime:#A3CA57; --lime-deep:#4E7A12; --lime-soft:#EDF5DF;
  --paper:#F5F6F2; --surface:#FFFFFF; --ink:#26252B; --muted:#65636D; --line:#DDE0D8;
  --blue:#2F7FD0;
  --font:"Schibsted Grotesk","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1B20; --surface:#26252C; --ink:#EEEDF1; --muted:#A9A7B2; --line:#383741;
    --lime-deep:#B9DD72; --lime-soft:#2C3620; --char:#33313A; --char-2:#2A2930;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1B20; --surface:#26252C; --ink:#EEEDF1; --muted:#A9A7B2; --line:#383741;
  --lime-deep:#B9DD72; --lime-soft:#2C3620; --char:#33313A; --char-2:#2A2930;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* Hero */
.hero{background:var(--char);color:var(--char-ink);position:relative;overflow:hidden}
.housed{position:relative;padding-top:78px;max-width:380px;margin:0 auto;width:100%}
.roof{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110%;max-width:420px;height:auto;overflow:visible}
.roof path{fill:none;stroke:var(--lime);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
.roof path.spark{fill:#fff;stroke:none;opacity:0;animation:fadein .5s 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px}
.hero-brand{display:flex;align-items:center;gap:10px;font-weight:700}
.hero-brand img{width:40px;height:40px;border-radius:10px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:var(--char-muted);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--lime);color:#1E2A0B}
.hero-grid{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:64px 0 72px}
.hero h1{font-size:clamp(36px,5.6vw,64px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0 0 20px;max-width:12ch}
.hero p.lead{font-size:clamp(17px,1.6vw,19px);color:var(--char-muted);margin:0 0 28px;max-width:44ch}
.hero-cta{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:#1E2A0B;font-weight:700;border-radius:999px;padding:14px 22px;text-decoration:none;font-size:16px}
.hero-cta:hover{filter:brightness(1.05)}
.for{margin-top:18px;font-size:13.5px;color:var(--char-muted)}

/* Phone */
.phone{width:100%;max-width:300px;margin:0 auto;background:#17161B;border-radius:44px;padding:9px;box-shadow:0 40px 70px -40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06) inset}
.screen{background:#F2F2F7;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;color:#1C1C1E;height:540px}
.sbar{display:flex;justify-content:space-between;padding:13px 24px 2px;font-size:12.5px;font-weight:600}
.th{text-align:center;padding:6px 10px 10px;border-bottom:1px solid #DCDCE0;background:#F8F8FA}
.th img{width:38px;height:38px;border-radius:50%;display:block;margin:0 auto 3px}
.th .ava-owner{width:38px;height:38px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;background:var(--lime);color:#1E2A0B;font-weight:800;font-size:15px}
.th b{display:block;font-size:12.5px}
.th span{font-size:11px;color:#8A8A8E}
.msgs{flex:1;overflow-y:auto;padding:12px 11px 14px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.m{max-width:85%;padding:8px 12px;border-radius:18px;font-size:13.5px;line-height:1.36;white-space:pre-line}
.m.out{align-self:flex-start;background:#E5E5EA;border-bottom-left-radius:5px}
.m.in{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.m.new{animation:pop .3s ease-out}
.stamp{align-self:center;font-size:11px;color:#8A8A8E;margin:6px 0 2px}
.typing{align-self:flex-start;background:#E5E5EA;border-radius:18px;padding:10px 13px;display:flex;gap:4px}
.typing.r{align-self:flex-end;background:var(--blue)}
.typing i{width:6px;height:6px;border-radius:50%;background:#8E8E93;animation:dots 1s infinite}
.typing.r i{background:rgba(255,255,255,.85)}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.3;transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.hero .screen{height:470px}

/* Sections */
section.block{padding:84px 0}
.kicker{font-weight:700;color:var(--lime-deep);font-size:15px;margin:0 0 8px}
h2{font-size:clamp(28px,3.6vw,42px);line-height:1.08;letter-spacing:-.025em;margin:0 0 14px;font-weight:800;max-width:20ch}
.sub{color:var(--muted);font-size:17px;margin:0 0 34px;max-width:56ch}

/* Customer picker */
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .15s, background .15s}
.pick b{font-size:15.5px}
.pick span{font-size:13px;color:var(--muted)}
.pick .tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.pick .tag i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.pick[aria-pressed="true"]{border-color:var(--lime);background:var(--lime-soft)}

.journey{display:grid;grid-template-columns:320px 1fr;gap:44px;align-items:start}
.journey .phone-col{position:sticky;top:20px}
.controls{display:flex;gap:8px;justify-content:center;margin-top:14px}
.ctl{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.ctl.main{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.ctl:disabled{opacity:.45;cursor:not-allowed}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{position:relative;padding:0 0 26px 52px;cursor:pointer}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);transition:all .2s}
.step::after{content:"";position:absolute;left:16.5px;top:38px;bottom:4px;width:1.5px;background:var(--line)}
.step:last-child::after{display:none}
.step.done::before{background:var(--lime-soft);border-color:var(--lime);color:var(--lime-deep)}
.step.active::before{background:var(--lime);border-color:var(--lime);color:#1E2A0B;box-shadow:0 0 0 6px color-mix(in srgb,var(--lime) 28%,transparent)}
.step-when{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px}
.who{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.who.auto{background:var(--lime-soft);color:var(--lime-deep)}
.who.you{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.step h3{margin:4px 0 4px;font-size:18px;letter-spacing:-.01em}
.step p{margin:0;color:var(--muted);font-size:15px;max-width:52ch}
.step:not(.active) h3{color:var(--muted)}
.step:not(.active):not(.done) p{display:none}
.notify{display:inline-flex;gap:8px;align-items:flex-start;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;max-width:52ch}
.notify b{white-space:nowrap}

/* Morning */
.dark{background:var(--char);color:var(--char-ink)}
.dark .kicker{color:var(--lime)}
.dark .sub{color:var(--char-muted)}
.morning{display:grid;grid-template-columns:1fr 320px;gap:56px;align-items:center}
.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:16px}
.points li{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:16px}
.points li span:first-child{width:28px;height:28px;border-radius:8px;background:rgba(163,202,87,.16);color:var(--lime);display:grid;place-items:center;font-weight:800}
.points b{display:block}
.points small{color:var(--char-muted);font-size:14.5px}

/* Overview */
.overview{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:center}
.screen.app{background:#F2F2F7}
.ah{padding:6px 16px 4px}
.ah b{font-size:19px;font-weight:800;display:block;letter-spacing:-.01em}
.ah span{font-size:12px;color:#6C6C70}
.chips{display:flex;gap:6px;padding:8px 14px 6px}
.chip{border:0;background:#E5E5EA;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#1C1C1E}
.chip[aria-pressed="true"]{background:#4A4852;color:#fff}
.ov-sum{font-size:11.5px;color:#6C6C70;padding:0 16px 4px}
.ovlist{flex:1;overflow-y:auto;padding:0 10px 14px}
.ovday{font-size:11.5px;font-weight:800;color:#6C6C70;margin:10px 6px 5px}
.ovjob{background:#fff;border-radius:12px;padding:9px 10px 9px 11px;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;margin-bottom:5px;border-left:4px solid var(--c);animation:pop .25s ease-out}
.ovjob time{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#1C1C1E;display:block}
.ovjob .tcol small{font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis}
.ovjob{grid-template-columns:48px 1fr auto}
.ovjob b{font-size:13px;display:block;line-height:1.2;color:#1C1C1E}
.ovjob small{font-size:11px;color:#6C6C70}
.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:#E3F1CF;color:#3F6A0E}.pill.wait{background:#FBEBD2;color:#9A5B0C}.pill.moved{background:#E3EEFA;color:#1F5FA0}.pill.new{background:#A3CA57;color:#1E2A0B}.pill.plan{background:#EDEDF0;color:#6C6C70}
.ov-points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.ov-points li{display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:16px}
.ov-points li > span:first-child{width:30px;height:30px;border-radius:9px;background:var(--lime-soft);color:var(--lime-deep);display:grid;place-items:center;font-weight:800}
.ov-points b{display:block}
.ov-points small{color:var(--muted);font-size:14.5px}

/* Calculator */
.calc{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:stretch}
.sliders{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:22px}
.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:8px}
.sl output{font-weight:800;font-variant-numeric:tabular-nums}
.sl input[type=range]{width:100%;accent-color:var(--lime-deep)}
.result{background:var(--lime);color:#1E2A0B;border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.result .big{font-size:clamp(56px,7vw,84px);font-weight:800;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.result .unit{font-size:19px;font-weight:700;margin-top:6px}
.result p{margin:0;font-size:15px}
.result .row{display:flex;justify-content:space-between;border-top:1px solid rgba(30,42,11,.2);padding-top:10px;font-size:15px}
.result .row b{font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--muted);margin-top:12px}

/* Close */
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 30px}
.next div{border-top:3px solid var(--lime);padding-top:14px}
.next b{display:block;font-size:17px;margin-bottom:4px}
.next span{color:var(--muted);font-size:15px}
.closing{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.closing p{margin:0;font-size:19px;font-weight:700;max-width:40ch}
.made{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.made img{height:22px;width:auto}
.oto-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .oto-l{display:none}:root:not([data-theme="light"]) .oto-d{display:inline}}
:root[data-theme="dark"] .oto-l{display:none}
:root[data-theme="dark"] .oto-d{display:inline}
footer{padding:26px 0 40px;color:var(--muted);font-size:13px}

@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;padding:40px 0 56px;gap:36px}
  .housed{padding-top:64px}
  .picker{grid-template-columns:1fr 1fr}
  .journey{grid-template-columns:1fr;gap:28px}
  .journey .phone-col{position:static}
  .morning,.calc{grid-template-columns:1fr;gap:30px}
  .overview{grid-template-columns:1fr;gap:30px}
  .overview > div:first-child{order:2}
  .next{grid-template-columns:1fr}
  section.block{padding:60px 0}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.roof path{stroke-dashoffset:0}.roof path.spark{opacity:1}html{scroll-behavior:auto}}
</style>
</head>

// ---------- Journey player ----------
let J = [], cur = 0, step = -1, playing = false, run = 0;
function renderPicker(){
  $("picker").innerHTML = J.map((c,i) => `<button class="pick" aria-pressed="${i===cur}" data-i="${i}" style="--c:${TYPE_C[c.type]}">
    <span class="tag"><i></i>${c.tag}</span><b>${c.name}</b><span>${c.sub}</span></button>`).join("");
  $("picker").querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => { selectCustomer(+b.dataset.i, true); }));
}
function renderSteps(){
  const c = J[cur];
  $("steps").innerHTML = c.steps.map((s,i) => `<li class="step ${i<step?"done":""} ${i===step?"active":""}" data-i="${i}" tabindex="0">
    <div class="step-when"><span>${s.when}</span><span class="who ${s.who}">${s.who==="auto"?t("auto"):t("you")}</span></div>
    <h3>${s.title}</h3><p>${s.body}</p>
    ${s.notify && i<=step ? `<div class="notify"><span aria-hidden="true">🔔</span><span><b>${t("notify")}</b> ${s.notify}</span></div>` : ""}
  </li>`).join("");
  $("steps").querySelectorAll(".step").forEach(li => {
    const go = () => { stop(); goTo(+li.dataset.i, false); };
    li.addEventListener("click", go); li.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
  $("prev").disabled = step <= 0; $("next").disabled = step >= c.steps.length-1;
  $("play").textContent = playing ? t("pause") : (step >= c.steps.length-1 ? t("replay") : t("play"));
}
function bubble(box, m, animate){
  const d = document.createElement("div"); d.className = "m " + (m.o ? "out" : "in") + (animate ? " new" : ""); d.textContent = m.t; box.append(d);
}
function stampEl(box, txt){ const s = document.createElement("div"); s.className = "stamp"; s.textContent = txt; box.append(s); }
async function goTo(i, animate){
  const c = J[cur]; const my = ++run; step = i; renderSteps();
  const box = $("jMsgs"); box.innerHTML = "";
  $("jTo").textContent = (lang==="no"?"Til: ":"To: ") + c.to;
  for (let k = 0; k < i; k++){ stampEl(box, c.steps[k].when); c.steps[k].msgs.forEach(m => bubble(box, m, false)); }
  const s = c.steps[i]; $("jClock").textContent = s.clock;
  stampEl(box, s.when); box.scrollTop = box.scrollHeight;
  for (const m of s.msgs){
    if (my !== run) return;
    if (animate){
      const ty = document.createElement("div"); ty.className = "typing" + (m.o ? "" : " r"); ty.innerHTML = "<i></i><i></i><i></i>"; box.append(ty); box.scrollTop = box.scrollHeight;
      await sleep(m.o ? 800 : 650); if (my !== run) return; ty.remove();
    }
    bubble(box, m, animate); box.scrollTop = box.scrollHeight;
    if (animate) await sleep(450);
  }
  if (animate && my === run) renderSteps();
  return my;
}
async function play(){
  const c = J[cur]; playing = true;
  if (step >= c.steps.length-1) step = -1;
  renderSteps();
  while (playing && step < c.steps.length-1){
    const my = await goTo(step+1, true);
    if (!playing || my !== run) return;
    await sleep(1600);
  }
  playing = false; renderSteps();
}
function stop(){ playing = false; run++; }
function selectCustomer(i, autoplay){
  stop(); cur = i; step = -1; renderPicker();
  if (autoplay) play(); else goTo(0, false);
}
$("prev").addEventListener("click", () => { stop(); if (step>0) goTo(step-1, false); });
$("next").addEventListener("click", () => { stop(); if (step < J[cur].steps.length-1) goTo(step+1, true); });
$("play").addEventListener("click", () => { if (playing){ stop(); renderSteps(); } else play(); });

// start journey autoplay when section is visible (once)
let started = false;
new IntersectionObserver((es, ob) => { es.forEach(e => { if (e.isIntersecting && !started){ started = true; ob.disconnect(); play(); } }); }, {threshold:.35}).observe($("steps"));

// ---------- Morning phone ----------
let mRun = 0, mStarted = false;
async function morningAnim(){
  const my = ++mRun; const box = $("mMsgs"); box.innerHTML = "";
  stampEl(box, lang==="no" ? "I dag 07:00" : "Today 07:00");
  const seq = [{o:1,t:t("morning")(today)},{o:0,t:t("mReply")},{o:1,t:t("mDone")},{o:1,t:t("mBooked"),stamp:"09:12"}];
  for (const m of seq){
    if (my !== mRun) return;
    if (m.stamp) stampEl(box, m.stamp);
    const ty = document.createElement("div"); ty.className = "typing" + (m.o ? "" : " r"); ty.innerHTML = "<i></i><i></i><i></i>"; box.append(ty); box.scrollTop = box.scrollHeight;
    await sleep(m.o ? 1100 : 800); if (my !== mRun) return; ty.remove();
    bubble(box, m, true); box.scrollTop = box.scrollHeight; await sleep(900);
  }
}
new IntersectionObserver((es, ob) => { es.forEach(e => { if (e.isIntersecting && !mStarted){ mStarted = true; ob.disconnect(); morningAnim(); } }); }, {threshold:.4}).observe($("mMsgs"));

// ---------- Calculator ----------
const calcVals = {rec:45, visits:2, once:10, mins:2};
const ranges = {rec:[5,150,1], visits:[1,4,1], once:[0,40,1], mins:[1,10,1]};
function renderSliders(){
  $("sliders").innerHTML = t("sl").map(([label,k]) => `<div class="sl"><label for="s_${k}"><span>${label}</span><output id="o_${k}">${calcVals[k]}</output></label>
    <input type="range" id="s_${k}" min="${ranges[k][0]}" max="${ranges[k][1]}" step="${ranges[k][2]}" value="${calcVals[k]}"></div>`).join("");
  Object.keys(ranges).forEach(k => $("s_"+k).addEventListener("input", e => { calcVals[k] = +e.target.value; $("o_"+k).textContent = calcVals[k]; calc(); }));
  calc();
}
function calc(){
  const msgs = calcVals.rec*calcVals.visits*3 + calcVals.once*4;
  const hrs = msgs*calcVals.mins/60;
  $("hrs").textContent = hrs >= 10 ? Math.round(hrs) : hrs.toFixed(1).replace(".", lang==="no"?",":".");
  $("msgsOut").textContent = msgs.toLocaleString(lang==="no"?"nb-NO":"en-US");
  $("daysOut").textContent = Math.round(hrs*12/7.5);
}

function renderTexts(){
  document.documentElement.lang = lang==="no" ? "nb" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  $("points").innerHTML = t("points").map((p,i) => `<li><span>${["✓","↻","+"][i]}</span><span><b>${p[0]}</b><small>${p[1]}</small></span></li>`).join("");
  $("nextSteps").innerHTML = t("nexts").map(n => `<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("");
  document.title = lang==="no" ? "ArnaHjem Renhold | Kundene på autopilot" : "ArnaHjem Renhold | Customers on autopilot";
}
function setLang(l){
  lang = l; $("lNo").setAttribute("aria-pressed", String(l==="no")); $("lEn").setAttribute("aria-pressed", String(l==="en"));
  renderTexts(); renderSliders(); renderOverview();
  stop(); J = journeys(); renderPicker(); goTo(Math.max(0,step), false);
  heroAnim(); if (mStarted) morningAnim();
}
$("lNo").addEventListener("click", () => setLang("no"));
$("lEn").addEventListener("click", () => setLang("en"));
